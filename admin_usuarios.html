<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Usuários do Sistema</title>
  <style>
    body {
      background-color: #111;
      font-family: Arial, sans-serif;
      color: #ddd;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      font-weight: normal;
      margin-bottom: 20px;
      color: #ccc;
    }

    .resumo {
      font-size: 15px;
      color: #aaa;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      max-width: 800px;
      margin: 0 auto 30px auto;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px 10px;
      border: 1px solid #333;
      text-align: center;
      font-size: 14px;
    }

    th {
      background-color: #222;
      color: #eee;
    }

    tr:nth-child(even) {
      background-color: #1a1a1a;
    }

    .btn-excluir {
      color: #e66;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
    }

    .btn-excluir:hover {
      color: #ff4c4c;
    }

    .voltar {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #ccc;
      font-size: 14px;
      border: 1px solid #444;
      padding: 8px 16px;
      border-radius: 6px;
      transition: background-color 0.3s;
    }

    .voltar:hover {
      background-color: #222;
    }
  </style>
</head>
<body>

  <h1>Usuários do Sistema</h1>

  <div class="resumo">
    Total de Usuários: {{ total_usuarios }}<br>
    Saldo Total: R$ {{ "%.2f"|format(saldo_total) }}
  </div>

  <table>
    <thead>
      <tr>
        <th>Nome</th>
        <th>E-mail</th>
        <th>Saldo (R$)</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      {% for u in usuarios %}
      <tr>
        <td>{{ u.username }}</td>
        <td>{{ u.email }}</td>
        <td>R$ {{ "%.2f"|format(u.saldo) }}</td>
        <td><a href="/excluir_usuario/{{ u.email }}" class="btn-excluir">Excluir</a></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <a href="/admin/painel" class="voltar">← Voltar ao Painel</a>

</body>
</html>
