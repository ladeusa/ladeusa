<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerenciar Valores de Cartões</title>
  <style>
    body {
      background-color: #111;
      font-family: Arial, sans-serif;
      color: #ddd;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      color: #ccc;
      font-weight: normal;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      max-width: 800px;
      margin: 0 auto 30px auto;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border: 1px solid #333;
      text-align: center;
      font-size: 14px;
    }

    th {
      background-color: #222;
      color: #eee;
    }

    tr:nth-child(even) {
      background-color: #1a1a1a;
    }

    input[type="number"] {
      width: 80px;
      padding: 5px;
      background-color: #222;
      border: 1px solid #444;
      color: #eee;
      border-radius: 4px;
      text-align: center;
    }

    button {
      background-color: #2a2a2a;
      color: #eee;
      border: 1px solid #444;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #333;
    }

    .voltar {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #ccc;
      font-size: 14px;
      border: 1px solid #444;
      padding: 8px 16px;
      border-radius: 6px;
      transition: background-color 0.3s;
    }

    .voltar:hover {
      background-color: #222;
    }
  </style>
</head>
<body>

  <h1>Gerenciar Valores de Cartões</h1>

  <table>
    <thead>
      <tr>
        <th>Bandeira</th>
        <th>Nível</th>
        <th>Valor (R$)</th>
        <th>Ação</th>
      </tr>
    </thead>
    <tbody>
      {% for item in valores %}
      <tr>
        <form action="/atualizar_valor" method="POST">
          <input type="hidden" name="bandeira" value="{{ item.bandeira }}">
          <input type="hidden" name="nivel" value="{{ item.nivel }}">
          <td>{{ item.bandeira }}</td>
          <td>{{ item.nivel }}</td>
          <td>
            <input type="number" step="0.01" name="valor" value="{{ "%.2f"|format(item.valor) }}" required>
          </td>
          <td><button type="submit">Salvar</button></td>
        </form>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <!-- BOTÃO CORRIGIDO -->
  <a href="/admin/painel" class="voltar">← Voltar ao Painel</a>

</body>
</html>
