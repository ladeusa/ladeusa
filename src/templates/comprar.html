<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Compra de BIN – LA DEUSA BINSHOP</title>
  <style>
    body {
      background-color: #000;
      color: #00ff9f;
      font-family: Arial, sans-serif;
      padding: 40px;
      text-align: center;
    }

    .box {
      background-color: #0a0a0a;
      padding: 30px;
      border-radius: 10px;
      display: inline-block;
      box-shadow: 0 0 20px #00ff9f33;
      min-width: 350px;
    }

    h1 {
      margin-bottom: 25px;
      text-transform: uppercase;
    }

    .info {
      margin-bottom: 15px;
      font-size: 18px;
    }

    .btn-confirmar {
      background-color: #00ff9f;
      color: #000;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-confirmar:hover {
      background-color: #00cc80;
    }

    .msg {
      margin-top: 25px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Confirmação de Compra</h1>

    <div class="info">BIN Selecionada: <strong>552267 - Bradesco Gold</strong></div>
    <div class="info">Preço: <strong>R$25,00</strong></div>
    <div class="info">Seu Saldo Atual: <strong>R$100,00</strong></div>

    <button class="btn-confirmar" onclick="comprar()">Confirmar Compra</button>

    <div class="msg" id="mensagem"></div>
  </div>

  <script>
    function comprar() {
      let preco = 25.00;
      let saldo = 100.00;

      if (saldo >= preco) {
        saldo -= preco;
        document.getElementById('mensagem').innerHTML = `✅ Compra realizada com sucesso! Novo saldo: R$${saldo.toFixed(2)}`;
      } else {
        document.getElementById('mensagem').innerHTML = `❌ Saldo insuficiente para esta compra.`;
      }
    }
  </script>

</body>
</html>
