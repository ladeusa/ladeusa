<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento Completo - LA DEUSA</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .content {
      background: rgba(20, 20, 30, 0.8);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.7);
      width: 400px;
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
      color: #b39ddb;
    }
    .btn {
      background-color: #5c6bc0;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn:hover {
      background-color: #7986cb;
    }
  </style>
</head>
<body>
  <div class="content">
    <h2>Pagamento Completo!</h2>
    <p>Você agora tem acesso ao painel.</p>
    <button class="btn" onclick="window.location.href='/logout'">Acessar o Painel</button>
  </div>
</body>
</html>
