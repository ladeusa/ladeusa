<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Adicionar BINs</title>
  <style>
    body {
      background-color: #111;
      font-family: Arial, sans-serif;
      color: #ddd;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      color: #ccc;
      margin-bottom: 30px;
    }

    .upload-box {
      margin-bottom: 30px;
    }

    input[type="file"] {
      color: #ccc;
      margin-bottom: 10px;
    }

    button {
      background-color: #2a2a2a;
      color: #eee;
      border: 1px solid #444;
      padding: 10px 25px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background-color: #333;
    }

    table {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto 30px;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border: 1px solid #333;
      font-size: 14px;
      text-align: center;
    }

    th {
      background-color: #222;
      color: #eee;
    }

    tr:nth-child(even) {
      background-color: #1a1a1a;
    }

    .voltar {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #ccc;
      font-size: 14px;
      border: 1px solid #444;
      padding: 8px 16px;
      border-radius: 6px;
    }

    .voltar:hover {
      background-color: #222;
    }
  </style>
</head>
<body>

  <h1>Adicionar BINs</h1>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div style="margin-bottom: 20px; font-size: 14px; padding: 10px; border: 1px solid #444; border-radius: 6px;
                  background-color: #220000; color: #ff6666; display: inline-block; max-width: 500px;">
        {% for message in messages %}
          <strong>{{ message }}</strong>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <div class="upload-box">
    <form action="/admin/adicionar_bins" method="POST" enctype="multipart/form-data">
      <input type="file" name="arquivo" accept=".txt" required><br>
      <button type="submit">Importar BINs (.txt)</button>
    </form>
  </div>

  <a href="/admin/painel" class="voltar">← Voltar ao Painel</a>

</body>
</html>
