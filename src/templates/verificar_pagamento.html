<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificação de Pagamento - LA DEUSA</title>
  <style>
    body {
      background-color: #181831;
      color: #e2e2e2;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      background-color: #222222;
      padding: 30px;
      border-radius: 10px;
      width: 380px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    h2 {
      color: #00bcd4;
      margin-bottom: 15px;
    }

    p {
      font-size: 1em;
      margin-bottom: 20px;
    }

    .btn {
      background-color: #5c6bc0;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover {
      background-color: #7986cb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔄 Verificando Pagamento</h2>
    <p>Seu pagamento está sendo verificado.<br>  
    Assim que confirmado, seu acesso ao painel será liberado!</p>
    <button class="btn" onclick="window.location.href='/painel'">⬅ Voltar ao Painel</button>
  </div>
</body>
</html>
