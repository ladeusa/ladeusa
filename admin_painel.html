<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sistema Interno</title>
  <style>
    body {
      background-color: #111;
      font-family: Arial, sans-serif;
      color: #ddd;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: #1c1c1c;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 22px;
      font-weight: normal;
      color: #ccc;
    }

    .btn {
      width: 100%;
      display: block;
      padding: 12px 0;
      margin: 10px auto;
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #ddd;
      font-size: 15px;
      text-decoration: none;
      transition: background-color 0.3s;
      box-sizing: border-box;
    }

    .btn:hover {
      background-color: #333;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Sistema Interno</h1>

    <a href="/gerenciar_usuarios" class="btn">Gerenciar Usuários</a>
    <a href="/estatisticas" class="btn">Estatísticas Gerais</a>
    <a href="/gerenciar_bins" class="btn">Gerenciar BINs</a>
    <a href="/admin/listar_bins" class="btn">Ver BINs Cadastradas</a>
    <a href="/gerenciar_valores" class="btn">Gerenciar Valores de Cartões</a>
    <a href="/admin/logout" class="btn">Sair</a>
  </div>

</body>
</html>
